name: Validate CI repository

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Pixaeron deployment action
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Validate deployment script syntax
        shell: bash
        run: bash -n actions/pixaeron/deploy-service/deploy-service.sh

      - name: Resolve deployment script through the action
        id: deployment
        uses: ./actions/pixaeron/deploy-service

      - name: Verify action output
        env:
          DEPLOYMENT_SCRIPT: ${{ steps.deployment.outputs.script_path }}
        shell: bash
        run: test -f "$DEPLOYMENT_SCRIPT"
