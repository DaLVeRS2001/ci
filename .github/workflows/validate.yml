name: Validate CI repository

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Pixaeron deployment action
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8 # v2.1.2
        with:
          version: 1.7.12
          cache: false
          pyflakes: false

      - name: Validate action script syntax
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r script; do
            bash -n "$script"
          done < <(find actions -name '*.sh' -type f)

      - name: Lint action scripts with shellcheck
        shell: bash
        run: |
          set -euo pipefail

          find actions -name '*.sh' -type f -print0 | xargs -0 shellcheck

      - name: Resolve deployment script through the action
        id: deployment
        uses: ./actions/pixaeron/deploy-service

      - name: Verify deployment action output
        env:
          DEPLOYMENT_SCRIPT: ${{ steps.deployment.outputs.script_path }}
        shell: bash
        run: test -f "$DEPLOYMENT_SCRIPT"

      - name: Resolve pipeline scripts through the action
        id: pipeline_scripts
        uses: ./actions/pixaeron/scripts

      - name: Verify pipeline scripts output
        env:
          PIPELINE_SCRIPTS: ${{ steps.pipeline_scripts.outputs.scripts_dir }}
        shell: bash
        run: |
          set -euo pipefail

          for script in validate-manifest validate-compose build-deploy-matrix \
            prepare-runtime-envs deploy-ordered; do
            test -f "$PIPELINE_SCRIPTS/$script.sh"
          done
