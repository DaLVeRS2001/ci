name: Pixaeron CI/CD

on:
  workflow_call:
    inputs:
      service:
        description: Deploy service project name or all
        required: false
        default: all
        type: string
      apollo_graph_ref:
        description: GraphOS production graph in graph-id@production form
        required: true
        type: string
    secrets:
      APOLLO_KEY:
        required: false
      VPS_HOST:
        required: false
      VPS_USER:
        required: false
      VPS_SSH_PRIVATE_KEY:
        required: false
      VPS_KNOWN_HOSTS:
        required: false

permissions:
  actions: read
  contents: read

jobs:
  verify:
    name: Verify projects
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d auth"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/auth
      NOTIFICATIONS_DATABASE_URL: postgresql://notifications:notifications@127.0.0.1:5432/notifications
      CONVERSION_DATABASE_URL: postgresql://conversion:conversion@127.0.0.1:5432/conversion
      PORT: 3000
      JWT_ISSUER: http://localhost:3000/auth
      JWT_AUDIENCE: pixaeron-api
      IP_HASH_SECRET: ci-only-ip-hash-secret-at-least-32-characters
      JWT_EXPIRATION_MS: 900000
      SESSION_REFRESH_EXPIRATION_MS: 86400000
      REFRESH_EXPIRATION_MS: 604800000
      PASSWORD_HASH_ROUNDS: 12
      REFRESH_TOKEN_HASH_ROUNDS: 12
      CORS_ORIGINS: http://localhost:3000
      REDIS_URL: redis://127.0.0.1:6379
      GOOGLE_CLIENT_ID: 1234567890-ci.apps.googleusercontent.com
      CAPTCHA_ENABLED: false
      EMAIL_DELIVERY_ENABLED: false

    outputs:
      deploy_matrix: ${{ steps.deploy_matrix.outputs.matrix }}
      has_deployments: ${{ steps.deploy_matrix.outputs.has_deployments }}
      subgraph_matrix: ${{ steps.deploy_matrix.outputs.subgraph_matrix }}
      graphos_check_required: ${{ steps.deploy_matrix.outputs.graphos_check_required }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Resolve pipeline scripts
        id: pipeline_scripts
        uses: DaLVeRS2001/ci/actions/pixaeron/scripts@cfeff15eb1e8621c92643063d6e271cbd231adab

      - name: Validate deployment manifest
        env:
          PIPELINE_SCRIPTS: ${{ steps.pipeline_scripts.outputs.scripts_dir }}
        shell: bash
        run: bash "$PIPELINE_SCRIPTS/validate-manifest.sh"

      - name: Validate Compose configuration
        env:
          PIPELINE_SCRIPTS: ${{ steps.pipeline_scripts.outputs.scripts_dir }}
        shell: bash
        run: bash "$PIPELINE_SCRIPTS/validate-compose.sh"

      - name: Set affected base and head SHAs
        if: github.event_name != 'workflow_dispatch'
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Generate CI access-token key
        shell: bash
        run: |
          set -euo pipefail

          private_key="$(mktemp)"
          trap 'rm -f "$private_key"' EXIT
          openssl genpkey -quiet \
            -algorithm RSA \
            -pkeyopt rsa_keygen_bits:2048 \
            -out "$private_key"
          private_key_base64="$(
            openssl pkcs8 -topk8 -nocrypt -in "$private_key" -outform DER |
              base64 --wrap=0
          )"
          echo "::add-mask::$private_key_base64"
          printf 'JWT_PRIVATE_KEY_BASE64=%s\n' "$private_key_base64" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Check protobuf contract compatibility
        if: github.event_name != 'workflow_dispatch'
        run: npx nx run-many -t contracts-breaking

      - name: Check manual-branch protobuf compatibility
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          NX_BASE: origin/main
        run: npx nx run-many -t contracts-breaking

      - name: Explain manual main protobuf verification
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        shell: bash
        run: echo '::notice title=Protobuf compatibility::The checked-out main commit is the compatibility baseline, so comparing it with itself would not provide a separate verification.'

      - name: Create service CI databases
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail

          docker exec "$POSTGRES_CONTAINER_ID" \
            psql --username postgres --dbname postgres --set ON_ERROR_STOP=1 \
              --command "CREATE ROLE notifications LOGIN PASSWORD 'notifications';"
          docker exec "$POSTGRES_CONTAINER_ID" \
            createdb --username postgres --owner notifications notifications
          docker exec "$POSTGRES_CONTAINER_ID" \
            psql --username postgres --dbname postgres --set ON_ERROR_STOP=1 \
              --command "CREATE ROLE conversion LOGIN PASSWORD 'conversion';"
          docker exec "$POSTGRES_CONTAINER_ID" \
            createdb --username postgres --owner conversion conversion

      - name: Verify affected projects
        if: github.event_name != 'workflow_dispatch'
        run: |
          npx nx affected -t lint test build
          npx nx affected -t schema-check
          npx nx affected -t db-integration --exclude=notifications,conversion-api
          DATABASE_URL="$NOTIFICATIONS_DATABASE_URL" npx nx affected -t db-integration --exclude='*,!notifications'
          DATABASE_URL="$CONVERSION_DATABASE_URL" npx nx affected -t db-integration --exclude='*,!conversion-api'
          npx nx affected -t redis-integration

      - name: Run affected end-to-end tests
        if: github.event_name != 'workflow_dispatch'
        run: npx nx affected -t e2e

      - name: Verify selected deployable projects
        if: github.event_name == 'workflow_dispatch'
        env:
          SERVICE_INPUT: ${{ inputs.service }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$SERVICE_INPUT" == "all" ]]; then
            projects="$(jq -r '.[].project' .github/deploy-services.json | paste -sd, -)"
          else
            jq -e --arg project "$SERVICE_INPUT" \
              'any(.[]; .project == $project)' \
              .github/deploy-services.json > /dev/null
            projects="$SERVICE_INPUT"
          fi

          npx nx run-many -t lint test
          npx nx run-many -t build --projects="$projects"
          npx nx run-many -t schema-check --projects="$projects"
          npx nx run-many -t db-integration --projects="$projects" --exclude=notifications,conversion-api
          if [[ ",$projects," == *",notifications,"* ]]; then
            DATABASE_URL="$NOTIFICATIONS_DATABASE_URL" npx nx run-many -t db-integration --projects=notifications
          fi
          if [[ ",$projects," == *",conversion-api,"* ]]; then
            DATABASE_URL="$CONVERSION_DATABASE_URL" npx nx run-many -t db-integration --projects=conversion-api
          fi
          npx nx run-many -t redis-integration
          npx nx run-many -t e2e

      - name: Build and smoke-test deployable Docker images
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          affected="$(npx nx show projects --affected --json)"

          while IFS=$'\t' read -r project dockerfile; do
            docker build --file "$dockerfile" --tag "pixaeron-ci:$project" .

            if [[ "$project" == "notifications" ]]; then
              bash apps/notifications/scripts/docker-smoke.sh "pixaeron-ci:$project"
            fi
          done < <(
            jq -r --argjson affected "$affected" '
              .[] |
              select(.project != "gateway") |
              select(.project as $project | ($affected | index($project))) |
              [.project, .dockerfile] | @tsv
            ' .github/deploy-services.json
          )

      - name: Build deployment matrix
        id: deploy_matrix
        env:
          PIPELINE_SCRIPTS: ${{ steps.pipeline_scripts.outputs.scripts_dir }}
          SERVICE_INPUT: ${{ inputs.service || 'all' }}
          TRUSTED_GRAPHOS_RUN: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
        shell: bash
        run: bash "$PIPELINE_SCRIPTS/build-deploy-matrix.sh"

  graphos-check:
    name: Check ${{ matrix.name }} schema in GraphOS
    needs: verify
    if: >-
      needs.verify.result == 'success' &&
      needs.verify.outputs.graphos_check_required == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.verify.outputs.subgraph_matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Require GraphOS configuration
        env:
          APOLLO_GRAPH_REF: ${{ inputs.apollo_graph_ref }}
          APOLLO_KEY: ${{ secrets.APOLLO_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APOLLO_GRAPH_REF" =~ ^[^@[:space:]]+@production$ ]] || { echo 'APOLLO_GRAPH_REF must use graph-id@production format.' >&2; exit 1; }
          [[ -n "$APOLLO_KEY" ]] || { echo 'APOLLO_KEY is required for trusted GraphOS checks.' >&2; exit 1; }

      - name: Check subgraph schema
        uses: apollographql-gh-actions/rover-subgraph-check@6b0bfef2687fc4004bb89c5228050d5151bd6ec3 # Rover 0.41.0
        env:
          APOLLO_CONFIG_HOME: /tmp/rover
          APOLLO_VCS_BRANCH: ${{ github.head_ref || github.ref_name }}
          APOLLO_VCS_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          apollo-key: ${{ secrets.APOLLO_KEY }}
          graph-ref: ${{ inputs.apollo_graph_ref }}
          name: ${{ matrix.name }}
          schema: ${{ matrix.schema }}

  verification-gate:
    name: Backend verification gate
    needs:
      - verify
      - graphos-check
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Evaluate required checks
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          GRAPHOS_CHECK_REQUIRED: ${{ needs.verify.outputs.graphos_check_required }}
          GRAPHOS_CHECK_RESULT: ${{ needs.graphos-check.result }}
        shell: bash
        run: |
          set -euo pipefail

          [[ "$VERIFY_RESULT" == "success" ]] || {
            echo "Project verification did not succeed: $VERIFY_RESULT" >&2
            exit 1
          }

          if [[ "$GRAPHOS_CHECK_REQUIRED" == "true" ]]; then
            [[ "$GRAPHOS_CHECK_RESULT" == "success" ]] || {
              echo "Required GraphOS schema checks did not succeed: $GRAPHOS_CHECK_RESULT" >&2
              exit 1
            }
          else
            [[ "$GRAPHOS_CHECK_RESULT" == "skipped" ]] || {
              echo "GraphOS schema checks ran unexpectedly: $GRAPHOS_CHECK_RESULT" >&2
              exit 1
            }
          fi

  build-images:
    name: Build ${{ matrix.project }} image
    needs:
      - verify
      - verification-gate
    if: >-
      !cancelled() &&
      needs.verify.result == 'success' &&
      needs.verification-gate.result == 'success' &&
      needs.verify.outputs.has_deployments == 'true' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.verify.outputs.deploy_matrix) }}

    env:
      IMAGE_TAG: sha-${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ matrix.imageName }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=${{ matrix.project }}
          cache-to: type=gha,mode=max,scope=${{ matrix.project }}

  deploy-release:
    name: Deploy ordered release
    needs:
      - verify
      - verification-gate
      - build-images
    if: >-
      !cancelled() &&
      needs.verify.result == 'success' &&
      needs.verification-gate.result == 'success' &&
      needs.build-images.result == 'success' &&
      needs.verify.outputs.has_deployments == 'true' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: pixaeron-production
      cancel-in-progress: false

    outputs:
      released: ${{ steps.release_guard.outputs.deploy }}

    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read

    env:
      DEPLOYMENTS: ${{ needs.verify.outputs.deploy_matrix }}
      IMAGE_TAG: sha-${{ github.sha }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Resolve pipeline scripts
        id: pipeline_scripts
        uses: DaLVeRS2001/ci/actions/pixaeron/scripts@cfeff15eb1e8621c92643063d6e271cbd231adab

      - name: Reject stale production release
        id: release_guard
        shell: bash
        run: |
          set -euo pipefail

          current_main_sha="$(git ls-remote --exit-code origin refs/heads/main | awk 'NR == 1 { print $1 }')"
          if [[ "$current_main_sha" != "$GITHUB_SHA" ]]; then
            message="Release $GITHUB_SHA was superseded by main commit $current_main_sha; no production changes were made."
            echo "::notice title=Stale production release::$message"
            printf '### Production deployment skipped\n\n%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'deploy=true' >> "$GITHUB_OUTPUT"

      - name: Validate production deployment configuration
        if: steps.release_guard.outputs.deploy == 'true'
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        shell: bash
        run: |
          set -euo pipefail

          required_names=(
            VPS_HOST
            VPS_USER
            VPS_SSH_PRIVATE_KEY
            VPS_KNOWN_HOSTS
            AWS_DEPLOY_ROLE_ARN
            AWS_REGION
          )
          missing_names=()

          for name in "${required_names[@]}"; do
            [[ -n "${!name:-}" ]] || missing_names+=("$name")
          done

          if (( ${#missing_names[@]} > 0 )); then
            printf 'Missing production deployment configuration: %s\n' "${missing_names[*]}" >&2
            exit 1
          fi

      - name: Configure AWS credentials
        if: steps.release_guard.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configure SSH
        if: steps.release_guard.outputs.deploy == 'true'
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail

          umask 077
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Resolve versioned deployment script
        if: steps.release_guard.outputs.deploy == 'true'
        id: deployment
        uses: DaLVeRS2001/ci/actions/pixaeron/deploy-service@1b61868aef23e961a4c8d65b2d8e376ac291b374

      - name: Log in to GHCR on VPS
        if: steps.release_guard.outputs.deploy == 'true'
        env:
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$GHCR_TOKEN" | ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
      - name: Prepare runtime environments
        if: steps.release_guard.outputs.deploy == 'true'
        env:
          PIPELINE_SCRIPTS: ${{ steps.pipeline_scripts.outputs.scripts_dir }}
        shell: bash
        run: bash "$PIPELINE_SCRIPTS/prepare-runtime-envs.sh"

      - name: Deploy services in manifest order
        if: steps.release_guard.outputs.deploy == 'true'
        env:
          PIPELINE_SCRIPTS: ${{ steps.pipeline_scripts.outputs.scripts_dir }}
          DEPLOYMENT_SCRIPT: ${{ steps.deployment.outputs.script_path }}
        shell: bash
        run: bash "$PIPELINE_SCRIPTS/deploy-ordered.sh"

      - name: Restore the pre-release Compose file
        if: ${{ failure() && steps.release_guard.outputs.deploy == 'true' }}
        shell: bash
        run: |
          set -uo pipefail

          if ! ssh -n -o BatchMode=yes -o ConnectTimeout=10 "$VPS_USER@$VPS_HOST" '
            cd /opt/pixaeron || exit 0
            if [ -f docker-compose.production.yaml.release-rollback ]; then
              mv -f docker-compose.production.yaml.release-rollback docker-compose.production.yaml
              echo "Restored the pre-release Compose file."
            else
              echo "No pre-release Compose baseline to restore."
            fi
          '; then
            echo "::error title=Compose restore failed::The pre-release Compose file may still be replaced on the VPS. Restore /opt/pixaeron/docker-compose.production.yaml.release-rollback by hand."
          fi

      - name: Discard the release Compose baseline
        if: ${{ success() && steps.release_guard.outputs.deploy == 'true' }}
        shell: bash
        run: |
          set -uo pipefail

          if ! ssh -n -o BatchMode=yes -o ConnectTimeout=10 "$VPS_USER@$VPS_HOST" \
            'rm -f -- /opt/pixaeron/docker-compose.production.yaml.release-rollback'; then
            echo "::warning title=Baseline cleanup failed::Could not remove the release Compose baseline."
          fi

      - name: Clean up staged runtime environments
        if: ${{ always() && steps.release_guard.outputs.deploy == 'true' }}
        shell: bash
        run: |
          set -uo pipefail

          if [[ ! -f ~/.ssh/id_ed25519 ]]; then
            echo 'SSH was not configured; no remote staging cleanup is needed.'
            exit 0
          fi

          while IFS= read -r compose_service; do
            staged_env="/opt/pixaeron/$compose_service.env.next"
            printf -v cleanup_command 'rm -f -- %q' "$staged_env"
            if ! ssh -n -o BatchMode=yes -o ConnectTimeout=10 "$VPS_USER@$VPS_HOST" "$cleanup_command"; then
              echo "::warning title=Staging cleanup failed::Could not remove the staged $compose_service runtime environment."
            fi
          done < <(jq -r '.[].composeService' .github/deploy-services.json)

          if ! ssh -n -o BatchMode=yes -o ConnectTimeout=10 "$VPS_USER@$VPS_HOST" \
            'rm -f -- /opt/pixaeron/docker-compose.production.yaml.next'; then
            echo '::warning title=Staging cleanup failed::Could not remove the staged Compose file.'
          fi

      - name: Publish deployed subgraph schemas
        if: >-
          steps.release_guard.outputs.deploy == 'true' &&
          needs.verify.outputs.graphos_check_required == 'true'
        env:
          APOLLO_CONFIG_HOME: /tmp/rover
          APOLLO_GRAPH_REF: ${{ inputs.apollo_graph_ref }}
          APOLLO_KEY: ${{ secrets.APOLLO_KEY }}
          APOLLO_VCS_BRANCH: ${{ github.ref_name }}
          APOLLO_VCS_COMMIT: ${{ github.sha }}
          SUBGRAPHS: ${{ needs.verify.outputs.subgraph_matrix }}
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r subgraph; do
            name="$(jq -r '.name' <<< "$subgraph")"
            schema="$(jq -r '.schema' <<< "$subgraph")"
            echo "Publishing $name schema to GraphOS."

            docker run --rm \
              --env APOLLO_CONFIG_HOME \
              --env APOLLO_KEY \
              --env APOLLO_VCS_BRANCH \
              --env APOLLO_VCS_COMMIT \
              --volume "$GITHUB_WORKSPACE:/workspace:ro" \
              --workdir /workspace \
              ghcr.io/apollographql/rover:0.41.0@sha256:ae42a40236050a5a410e7e4fd934ba5f851a6783666ff2f1e065ee5de6c2033d \
              subgraph publish "$APOLLO_GRAPH_REF" \
              --name "$name" \
              --schema "$schema" \
              --no-url \
              --check \
              --skip-update-check
          done < <(jq -c '.include[]' <<< "$SUBGRAPHS")

  release-outcome:
    name: Report manual release outcome
    needs:
      - verify
      - build-images
      - deploy-release
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Require an executed release
        env:
          SERVICE_INPUT: ${{ inputs.service || 'all' }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          HAS_DEPLOYMENTS: ${{ needs.verify.outputs.has_deployments }}
          BUILD_RESULT: ${{ needs.build-images.result }}
          DEPLOY_RESULT: ${{ needs.deploy-release.result }}
          RELEASED: ${{ needs.deploy-release.outputs.released }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$VERIFY_RESULT" != 'success' ]]; then
            echo "Verification finished as $VERIFY_RESULT; the verification gate already reports it."
            exit 0
          fi

          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo "::warning title=Verification-only dispatch::A manual run on $GITHUB_REF verifies only. Images and the production release run exclusively on refs/heads/main."
            printf '### No deployment\n\nRelease jobs run only on refs/heads/main. This run verified "%s" and stopped.\n' \
              "$SERVICE_INPUT" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$DEPLOY_RESULT" == 'success' && "$RELEASED" == 'true' ]]; then
            printf '### Release executed\n\nService input "%s" was released from commit %s.\n' \
              "$SERVICE_INPUT" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error title=Manual release deployed nothing::service='$SERVICE_INPUT' has_deployments='$HAS_DEPLOYMENTS' build-images='$BUILD_RESULT' deploy-release='$DEPLOY_RESULT' released='${RELEASED:-<unset>}'. An explicit release dispatch on main that changes nothing is a contradiction." >&2
          exit 1
