name: Pixaeron frontend verification

on:
  workflow_call:
    inputs:
      graphql_api_url:
        description: Browser-facing production GraphQL endpoint
        required: true
        type: string
      google_client_id:
        description: Public Google Identity Services web client ID
        required: true
        type: string
      turnstile_site_key:
        description: Public Cloudflare Turnstile site key
        required: true
        type: string
      apollo_graph_ref:
        description: GraphOS production graph in graph-id@production form
        required: true
        type: string
    secrets:
      APOLLO_KEY:
        required: false

permissions:
  actions: read
  contents: read

jobs:
  verify:
    name: Verify frontend
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    env:
      GRAPHQL_API_URL: ${{ inputs.graphql_api_url }}
      GOOGLE_CLIENT_ID: ${{ inputs.google_client_id }}
      TURNSTILE_SITE_KEY: ${{ inputs.turnstile_site_key }}
      TRUSTED_RUN: >-
        ${{ github.event_name != 'pull_request' ||
        (
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]'
        ) }}

    steps:
      - name: Validate public build configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GRAPHQL_API_URL" == 'https://api.pixaeron.com/graphql' ]] || { echo 'GRAPHQL_API_URL must be https://api.pixaeron.com/graphql.' >&2; exit 1; }
          [[ "$GOOGLE_CLIENT_ID" =~ ^[0-9]+-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$ ]] || { echo 'GOOGLE_CLIENT_ID has an invalid web client ID format.' >&2; exit 1; }
          [[ "$TURNSTILE_SITE_KEY" != *[[:space:]]* && ${#TURNSTILE_SITE_KEY} -ge 20 ]] || { echo 'TURNSTILE_SITE_KEY has an invalid format.' >&2; exit 1; }

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Rover
        if: env.TRUSTED_RUN == 'true'
        uses: apollographql-gh-actions/install-rover@4e7208e7343acc2796d3bb2b35e4504ea10f0cb2 # Rover 0.41.0

      - name: Fetch composed GraphOS API schema
        if: env.TRUSTED_RUN == 'true'
        env:
          APOLLO_GRAPH_REF: ${{ inputs.apollo_graph_ref }}
          APOLLO_KEY: ${{ secrets.APOLLO_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APOLLO_GRAPH_REF" =~ ^[^@[:space:]]+@production$ ]] || { echo 'APOLLO_GRAPH_REF must use graph-id@production format.' >&2; exit 1; }
          [[ -n "$APOLLO_KEY" ]] || { echo 'APOLLO_KEY is required for trusted GraphOS schema fetches.' >&2; exit 1; }
          rover --skip-update-check graph fetch "$APOLLO_GRAPH_REF" --output graphql/schema.graphql

      - name: Check committed GraphQL schema snapshot
        if: env.TRUSTED_RUN == 'true'
        shell: bash
        run: |
          git ls-files --error-unmatch graphql/schema.graphql > /dev/null || {
            echo 'graphql/schema.graphql must remain a committed schema snapshot.' >&2
            exit 1
          }
          git diff --exit-code -- graphql/schema.graphql || {
            echo 'graphql/schema.graphql differs from the composed GraphOS API schema. Run npm run schema:pull and commit the result.' >&2
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify frontend
        run: npm run check

      - name: Validate Cloudflare deployment configuration
        run: npm run cloudflare:deploy:dry-run

      - name: Preserve verified production assets
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pixaeron-frontend-${{ github.sha }}
          path: build
          if-no-files-found: error
          retention-days: 1
